# ──────────────────────────────────────────────
# Nginx — Reverse Proxy & Load Balancer
#
# WHAT IS A REVERSE PROXY?
# Without Nginx, clients talk directly to each service:
#   - http://localhost:3001/api/auth/register  (auth service)
#   - http://localhost:3002/api/events/ingest  (ingestion service)
#   - http://localhost:3003/api/query/...      (query service)
#
# With Nginx, there's ONE entry point (port 80):
#   - http://localhost/api/auth/*    → routed to auth service
#   - http://localhost/api/events/*  → routed to ingestion service (load balanced)
#   - http://localhost/api/query/*   → routed to query service
#
# The client doesn't know (or care) which internal service handles
# their request. This is DECOUPLING — services can move, scale,
# or restart without the client noticing.
#
# SYSTEM DESIGN CONNECTION:
# This is the API Gateway pattern. In production you might use
# AWS ALB, Kong, or Envoy — Nginx is the simplest version of this
# pattern and perfect for learning the concept.
# ──────────────────────────────────────────────

# ── Worker processes ──
# auto = one worker per CPU core on the host machine.
# Each worker handles thousands of concurrent connections.
worker_processes auto;

events {
    # Max simultaneous connections per worker.
    # 1024 is fine for development. Production might use 4096+.
    worker_connections 1024;
}

http {
    # ── Logging ──
    # Access log = every request. Error log = only problems.
    # In production, you'd typically ship these to a log aggregator
    # (ELK stack, Datadog, etc.)
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Upstream: Auth Service ──
    # Currently just 1 instance. When we add replicas later,
    # we add more server lines here and Nginx automatically
    # load balances across them (round-robin by default).
    upstream auth_service {
        server auth:3001;
    }

    # ── Upstream: Ingestion Service (3 instances) ──
    upstream ingestion_service {
        server ingestion_1:3002;
        server ingestion_2:3002;
        server ingestion_3:3002;
    }

    # ── Upstream: Query Service ──
    # upstream query_service {
    #     server query:3003;
    # }

    server {
        listen 80;
        server_name localhost;

        # ── Auth routes ──
        # Everything starting with /api/auth/ goes to the auth service.
        #
        # proxy_pass = "forward this request to the upstream"
        # proxy_set_header = pass along the original client info
        #   (otherwise the auth service sees Nginx's IP, not the user's)
        location /api/auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Ingestion routes (Phase 2) ──
        location /api/events/ {
            proxy_pass http://ingestion_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Query routes (Phase 4) ──
        # location /api/query/ {
        #     proxy_pass http://query_service;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #
        #     # WebSocket support for real-time dashboard
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        # }

        # ── Dashboard static files (Phase 4) ──
        # location / {
        #     root /usr/share/nginx/html;
        #     index index.html;
        #     try_files $uri $uri/ /index.html;
        # }

        # ── Health check for Nginx itself ──
        location /health {
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
